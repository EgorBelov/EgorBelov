<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Manga portrait panel — the Magician">
  <defs>
    <pattern id="hatchP" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1a1a1a" stroke-width="1.4"/>
    </pattern>
    <pattern id="hatchTight" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.2"/>
    </pattern>
    <pattern id="dotsP" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="4" cy="4" r="0.7" fill="#2c2c2c"/>
    </pattern>
    <linearGradient id="vfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Page background -->
  <rect width="1200" height="460" fill="#000000"/>

  <!-- ───────── PANEL A — full figure (left, 0-680) ───────── -->
  <g>
    <rect x="20" y="20" width="640" height="420" fill="#0a0a0a"/>
    <rect x="20" y="20" width="640" height="420" fill="url(#hatchP)" opacity="0.6"/>
    <rect x="20" y="20" width="640" height="420" fill="none" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Floor ground hatching -->
    <rect x="20" y="360" width="640" height="80" fill="url(#hatchTight)" opacity="0.55"/>
    <line x1="20" y1="360" x2="660" y2="360" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>

    <!-- Card suits floating in background -->
    <g fill="#ffffff" opacity="0.10">
      <text x="100" y="120" font-family="Georgia, serif" font-size="44">♠</text>
      <text x="560" y="140" font-family="Georgia, serif" font-size="36">♣</text>
      <text x="80"  y="260" font-family="Georgia, serif" font-size="30">♦</text>
      <text x="600" y="290" font-family="Georgia, serif" font-size="40">♥</text>
      <text x="300" y="80"  font-family="Georgia, serif" font-size="22">♠</text>
    </g>

    <!-- Figure silhouette — central, tall — built from paths -->
    <g transform="translate(340,80)">
      <!-- Coat / shoulders / torso silhouette (black solid + white contour) -->
      <path d="M -110,260
               L -90,170
               L -50,140
               L -55,118
               L 55,118
               L 50,140
               L 90,170
               L 110,260
               L 95,360
               L -95,360 Z"
            fill="#000000" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="miter"/>

      <!-- Inner coat panel line -->
      <line x1="0" y1="125" x2="0" y2="358" stroke="#ffffff" stroke-width="1.2"/>

      <!-- Collar V -->
      <path d="M -40,118 L 0,170 L 40,118" fill="none" stroke="#ffffff" stroke-width="1.4"/>

      <!-- Neck -->
      <rect x="-14" y="98" width="28" height="22" fill="#000" stroke="#ffffff" stroke-width="1.3"/>

      <!-- Head — slight 3/4 angle -->
      <path d="M -38,40
               C -42,10 -34,-30 -8,-44
               C 22,-52 46,-30 48,4
               C 50,28 44,58 30,76
               C 18,92 0,98 -14,96
               C -30,92 -38,76 -40,60 Z"
            fill="#000000" stroke="#ffffff" stroke-width="1.6"/>

      <!-- Hair: slicked-back with one falling strand -->
      <path d="M -38,40
               C -52,-4 -38,-44 0,-52
               C 36,-60 60,-40 56,-8
               L 52,-4
               C 40,-22 24,-32 4,-32
               C -16,-32 -32,-18 -38,4 Z"
            fill="#ffffff"/>
      <!-- Falling strand over forehead -->
      <path d="M -10,-20 C -6,-4 -2,8 -14,28 L -18,28 C -10,8 -14,-4 -18,-18 Z"
            fill="#ffffff"/>

      <!-- Closed eye line + tear mark -->
      <path d="M -8,28 L 14,28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <!-- Teardrop -->
      <path d="M 22,38 C 24,46 26,52 22,54 C 18,52 20,46 22,38 Z" fill="#ffffff"/>
      <!-- Star mark on opposite cheek -->
      <g transform="translate(-20,38) scale(0.85)" fill="#ffffff">
        <polygon points="0,-7 2,-2 7,-2 3,2 5,8 0,4 -5,8 -3,2 -7,-2 -2,-2"/>
      </g>

      <!-- Mouth — faint smirk -->
      <path d="M 2,60 Q 14,66 22,58" stroke="#ffffff" stroke-width="1.4" fill="none"/>

      <!-- Raised arm holding a card -->
      <g>
        <!-- arm -->
        <path d="M 90,170 L 165,80 L 192,60 L 200,80 L 178,100 L 110,200 Z"
              fill="#000000" stroke="#ffffff" stroke-width="1.4"/>
        <!-- card -->
        <g transform="translate(185,30) rotate(18)">
          <rect x="-22" y="-32" width="44" height="64" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
          <text x="-16" y="-14" font-family="Georgia, serif" font-size="14" fill="#000">A</text>
          <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#000">♠</text>
          <text x="14" y="28" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#000" transform="rotate(180,14,24)">A</text>
        </g>
      </g>

      <!-- Other arm tucked -->
      <path d="M -90,170 L -110,260 L -90,280 L -78,200 Z"
            fill="#000000" stroke="#ffffff" stroke-width="1.4"/>
    </g>

    <!-- Speed-line burst from upper-right -->
    <g stroke="#ffffff" stroke-width="1" opacity="0.45">
      <line x1="660" y1="20" x2="540" y2="100"/>
      <line x1="660" y1="40" x2="500" y2="150"/>
      <line x1="660" y1="70" x2="470" y2="200"/>
      <line x1="660" y1="110" x2="460" y2="250"/>
    </g>

    <!-- Panel label -->
    <text x="40" y="48" font-family="Courier New, Menlo, monospace" font-size="11" fill="#888" letter-spacing="4">
      PANEL A — THE MAGICIAN
    </text>
  </g>

  <!-- ───────── PANEL B — close-up of eye (right top, 680-1180 × 20-220) ───────── -->
  <g>
    <rect x="680" y="20" width="500" height="200" fill="#0a0a0a"/>
    <rect x="680" y="20" width="500" height="200" fill="url(#dotsP)" opacity="0.8"/>
    <rect x="680" y="20" width="500" height="200" fill="none" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Heavy hatching upper-left corner -->
    <path d="M 680,20 L 880,20 L 680,180 Z" fill="url(#hatchTight)" opacity="0.7"/>

    <!-- Stylized eye -->
    <g transform="translate(930,120)">
      <!-- Eye outline -->
      <path d="M -160,0 C -90,-60 90,-60 160,0 C 90,60 -90,60 -160,0 Z"
            fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
      <!-- Upper lash mass -->
      <path d="M -160,0 C -90,-60 90,-60 160,0 L 140,-6 C 80,-50 -80,-50 -140,-6 Z"
            fill="#000000"/>
      <!-- Iris -->
      <circle cx="0" cy="6" r="44" fill="#000000"/>
      <!-- Highlight -->
      <circle cx="-14" cy="-10" r="8" fill="#ffffff"/>
      <circle cx="18" cy="20" r="3" fill="#ffffff"/>
      <!-- Tear mark below eye -->
      <path d="M 80,40 C 84,58 88,72 80,78 C 72,72 76,58 80,40 Z" fill="#ffffff"/>
    </g>

    <!-- Sound-effect style text -->
    <text x="710" y="58" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#ffffff" opacity="0.85">
      “ your move. ”
    </text>

    <!-- Panel label -->
    <text x="700" y="208" font-family="Courier New, Menlo, monospace" font-size="11" fill="#888" letter-spacing="4">
      PANEL B — EYE CONTACT
    </text>
  </g>

  <!-- ───────── PANEL C — hand fan of cards (right bottom, 680-1180 × 240-440) ───────── -->
  <g>
    <rect x="680" y="240" width="500" height="200" fill="#0a0a0a"/>
    <rect x="680" y="240" width="500" height="200" fill="url(#hatchP)" opacity="0.55"/>
    <rect x="680" y="240" width="500" height="200" fill="none" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Vignette -->
    <rect x="680" y="320" width="500" height="120" fill="url(#vfade)"/>

    <!-- Hand silhouette holding fan of cards -->
    <g transform="translate(930,360)">
      <!-- Wrist/forearm -->
      <path d="M -60,80 L -30,30 L 30,30 L 60,80 Z" fill="#000" stroke="#ffffff" stroke-width="1.4"/>
      <!-- Palm -->
      <ellipse cx="0" cy="14" rx="46" ry="22" fill="#000" stroke="#ffffff" stroke-width="1.4"/>

      <!-- Fan of 5 cards -->
      <g>
        <g transform="rotate(-40) translate(0,-50)">
          <rect x="-22" y="-46" width="44" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/>
          <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#000">♠</text>
        </g>
        <g transform="rotate(-20) translate(0,-58)">
          <rect x="-22" y="-46" width="44" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/>
          <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#000">♣</text>
        </g>
        <g transform="translate(0,-62)">
          <rect x="-22" y="-46" width="44" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/>
          <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#000">★</text>
        </g>
        <g transform="rotate(20) translate(0,-58)">
          <rect x="-22" y="-46" width="44" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/>
          <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#000">♦</text>
        </g>
        <g transform="rotate(40) translate(0,-50)">
          <rect x="-22" y="-46" width="44" height="64" rx="3" fill="#fff" stroke="#000" stroke-width="1.2"/>
          <text x="0" y="-6" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#000">♥</text>
        </g>
      </g>
    </g>

    <!-- Caption -->
    <text x="710" y="280" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#aaa">
      He never plays cards he can lose.
    </text>

    <!-- Panel label -->
    <text x="700" y="428" font-family="Courier New, Menlo, monospace" font-size="11" fill="#888" letter-spacing="4">
      PANEL C — A FULL HAND
    </text>
  </g>

  <!-- Outer page frame -->
  <rect x="0.5" y="0.5" width="1199" height="459" fill="none" stroke="#ffffff" stroke-width="1"/>
</svg>
