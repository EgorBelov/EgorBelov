<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Final Panel — Building the next chapter">
  <defs>
    <pattern id="hatchF" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#161616" stroke-width="1.3"/>
    </pattern>
  </defs>

  <rect width="1200" height="200" fill="#000000"/>
  <rect width="1200" height="200" fill="url(#hatchF)" opacity="0.7"/>

  <!-- Top & bottom border -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#ffffff" stroke-width="1"/>
  <line x1="0" y1="199.5" x2="1200" y2="199.5" stroke="#ffffff" stroke-width="1"/>

  <!-- Central panel -->
  <rect x="240" y="40" width="720" height="120" fill="#000000" stroke="#ffffff" stroke-width="1.2"/>

  <!-- Corner brackets inside -->
  <g stroke="#ffffff" stroke-width="1.2" fill="none">
    <path d="M 260 60 L 260 80 M 260 60 L 280 60"/>
    <path d="M 940 140 L 940 120 M 940 140 L 920 140"/>
  </g>

  <!-- Label -->
  <text x="600" y="86" text-anchor="middle" font-family="Courier New, Menlo, monospace" font-size="12" fill="#888888" letter-spacing="6">
    CURRENT STATUS
  </text>

  <!-- Main line -->
  <text x="600" y="118" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#ffffff">
    Building the next chapter...
  </text>

  <!-- Bottom line -->
  <text x="600" y="146" text-anchor="middle" font-family="Courier New, Menlo, monospace" font-size="11" fill="#5a5a5a" letter-spacing="4">
    TO BE CONTINUED  —  EOF
  </text>
</svg>
