<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Manga scene — The Stitched">
  <defs>
    <pattern id="hatchS" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#161616" stroke-width="1.3"/>
    </pattern>
    <pattern id="stitchPat" patternUnits="userSpaceOnUse" width="22" height="22">
      <g stroke="#ffffff" stroke-width="1" opacity="0.18" fill="none">
        <line x1="2" y1="11" x2="20" y2="11"/>
        <line x1="6" y1="8" x2="6" y2="14"/>
        <line x1="12" y1="8" x2="12" y2="14"/>
        <line x1="18" y1="8" x2="18" y2="14"/>
      </g>
    </pattern>
    <linearGradient id="vS" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#000"/>
  <rect width="1200" height="220" fill="url(#hatchS)" opacity="0.55"/>
  <rect width="1200" height="220" fill="url(#stitchPat)"/>

  <!-- Top/bottom borders -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#fff" stroke-width="1"/>
  <line x1="0" y1="219.5" x2="1200" y2="219.5" stroke="#fff" stroke-width="1"/>

  <!-- Central horizontal stitch line across full panel -->
  <g stroke="#ffffff" stroke-width="1.4" fill="none">
    <line x1="40" y1="110" x2="500" y2="110"/>
    <line x1="700" y1="110" x2="1160" y2="110"/>
    <!-- stitch ticks -->
    <g>
      <line x1="80" y1="104" x2="80" y2="116"/>
      <line x1="140" y1="104" x2="140" y2="116"/>
      <line x1="200" y1="104" x2="200" y2="116"/>
      <line x1="260" y1="104" x2="260" y2="116"/>
      <line x1="320" y1="104" x2="320" y2="116"/>
      <line x1="380" y1="104" x2="380" y2="116"/>
      <line x1="440" y1="104" x2="440" y2="116"/>
      <line x1="740" y1="104" x2="740" y2="116"/>
      <line x1="800" y1="104" x2="800" y2="116"/>
      <line x1="860" y1="104" x2="860" y2="116"/>
      <line x1="920" y1="104" x2="920" y2="116"/>
      <line x1="980" y1="104" x2="980" y2="116"/>
      <line x1="1040" y1="104" x2="1040" y2="116"/>
      <line x1="1100" y1="104" x2="1100" y2="116"/>
    </g>
  </g>

  <!-- Edge vignette -->
  <rect width="1200" height="220" fill="url(#vS)" opacity="0.6"/>

  <!-- Figure — center, smaller scale, playful pose -->
  <g transform="translate(600,110)">
    <!-- Background circle (manga focus) -->
    <circle cx="0" cy="0" r="92" fill="#000" stroke="#ffffff" stroke-width="1.4"/>
    <g stroke="#ffffff" stroke-width="0.9" opacity="0.45">
      <line x1="0" y1="-92" x2="0" y2="-130"/>
      <line x1="0" y1="92" x2="0" y2="130"/>
      <line x1="-92" y1="0" x2="-130" y2="0"/>
      <line x1="92" y1="0" x2="130" y2="0"/>
      <line x1="65" y1="-65" x2="92" y2="-92"/>
      <line x1="-65" y1="65" x2="-92" y2="92"/>
      <line x1="65" y1="65" x2="92" y2="92"/>
      <line x1="-65" y1="-65" x2="-92" y2="-92"/>
    </g>

    <!-- Head -->
    <path d="M -26,-30
             C -30,-58 -18,-78 0,-80
             C 18,-78 30,-58 26,-30
             C 22,-12 12,-6 0,-6
             C -12,-6 -22,-12 -26,-30 Z"
          fill="#000" stroke="#ffffff" stroke-width="1.3"/>
    <!-- Hair: messy with twin strands hanging -->
    <path d="M -26,-30
             C -34,-66 -16,-86 0,-88
             C 20,-86 34,-66 26,-30
             L 24,-30
             C 18,-58 8,-66 0,-66
             C -8,-66 -16,-58 -24,-30 Z"
          fill="#ffffff"/>
    <!-- Hanging strands -->
    <path d="M -22,-32 L -24,8 L -18,8 L -16,-32 Z" fill="#ffffff"/>
    <path d="M 22,-32 L 24,12 L 18,12 L 16,-32 Z" fill="#ffffff"/>

    <!-- Stitch on cheek -->
    <g stroke="#ffffff" stroke-width="1.2" fill="none">
      <line x1="14" y1="-22" x2="22" y2="-12"/>
      <line x1="16" y1="-24" x2="14" y2="-20"/>
      <line x1="20" y1="-18" x2="18" y2="-14"/>
      <line x1="24" y1="-14" x2="22" y2="-10"/>
    </g>
    <!-- Stitch under eye -->
    <g stroke="#ffffff" stroke-width="1.2" fill="none">
      <line x1="-18" y1="-20" x2="-10" y2="-20"/>
      <line x1="-16" y1="-22" x2="-16" y2="-18"/>
      <line x1="-12" y1="-22" x2="-12" y2="-18"/>
    </g>
    <!-- Eyes — wide, manic -->
    <circle cx="-12" cy="-32" r="3" fill="#ffffff"/>
    <circle cx="12" cy="-32" r="3" fill="#ffffff"/>
    <!-- Mouth — slight smile -->
    <path d="M -8,-14 Q 0,-8 8,-14" stroke="#ffffff" stroke-width="1.4" fill="none"/>

    <!-- Neck -->
    <rect x="-7" y="-6" width="14" height="10" fill="#000" stroke="#ffffff" stroke-width="1"/>

    <!-- Torso / coat -->
    <path d="M -38,6
             L -22,0
             L 22,0
             L 38,6
             L 32,80
             L -32,80 Z"
          fill="#000" stroke="#ffffff" stroke-width="1.3"/>
    <!-- Coat seam -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#ffffff" stroke-width="1"/>
    <!-- Stitches on coat -->
    <g stroke="#ffffff" stroke-width="0.9" fill="none">
      <line x1="-14" y1="22" x2="-14" y2="34"/>
      <line x1="-18" y1="24" x2="-10" y2="24"/>
      <line x1="-18" y1="30" x2="-10" y2="30"/>
      <line x1="14" y1="22" x2="14" y2="34"/>
      <line x1="10" y1="24" x2="18" y2="24"/>
      <line x1="10" y1="30" x2="18" y2="30"/>
    </g>

    <!-- Arm holding a scalpel/quinque diagonal -->
    <path d="M 38,6 L 78,-30 L 84,-22 L 44,18 Z" fill="#000" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Scalpel blade -->
    <path d="M 76,-36 L 116,-72 L 122,-66 L 84,-26 Z" fill="#ffffff" stroke="#000" stroke-width="1"/>
    <!-- Highlight on blade -->
    <line x1="84" y1="-34" x2="118" y2="-68" stroke="#000" stroke-width="0.6"/>

    <!-- Other arm relaxed -->
    <path d="M -38,6 L -52,60 L -44,68 L -28,18 Z" fill="#000" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Stitch X marks scattered -->
  <g stroke="#ffffff" stroke-width="1.2" fill="none" opacity="0.7">
    <g transform="translate(120,50)">
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
    <g transform="translate(220,170)">
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
    <g transform="translate(960,170)">
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
    <g transform="translate(1060,50)">
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
  </g>

  <!-- Caption left -->
  <g transform="translate(40,40)">
    <text font-family="Georgia, serif" font-style="italic" font-size="22" fill="#fff">smile —</text>
    <text y="24" font-family="Courier New, Menlo, monospace" font-size="11" fill="#888" letter-spacing="4">SFX  ·  tch</text>
  </g>

  <!-- Caption right -->
  <g transform="translate(820,40)">
    <rect width="340" height="58" fill="#000" stroke="#ffffff" stroke-width="1.2"/>
    <text x="16" y="24" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#fff">
      Pain is a teacher.
    </text>
    <text x="16" y="44" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#aaa">
      Cheerfulness is a weapon.
    </text>
  </g>

  <!-- Page label -->
  <text x="20" y="212" font-family="Courier New, Menlo, monospace" font-size="10" fill="#666" letter-spacing="4">
    INTERLUDE  ·  THE STITCHED
  </text>
</svg>
