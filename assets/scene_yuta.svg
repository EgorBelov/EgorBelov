<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Manga scene — The Swordbearer">
  <defs>
    <pattern id="hatchY" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(60)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#161616" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatchY2" patternUnits="userSpaceOnUse" width="3" height="3" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#000" stroke-width="1"/>
    </pattern>
    <linearGradient id="floorY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="#000"/>
  <rect width="1200" height="220" fill="url(#hatchY)" opacity="0.6"/>

  <!-- Top/bottom borders -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#fff" stroke-width="1"/>
  <line x1="0" y1="219.5" x2="1200" y2="219.5" stroke="#fff" stroke-width="1"/>

  <!-- Distant city silhouette (right side, atmospheric) -->
  <g fill="#000" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8">
    <path d="M 760,160 L 760,120 L 790,120 L 790,100 L 820,100 L 820,140 L 860,140 L 860,90 L 880,90 L 880,120 L 920,120 L 920,150 L 960,150 L 960,110 L 990,110 L 990,140 L 1030,140 L 1030,80 L 1060,80 L 1060,130 L 1100,130 L 1100,160 L 1140,160 L 1140,140 L 1180,140 L 1180,170 L 1200,170 L 1200,220 L 760,220 Z"/>
  </g>

  <!-- Moon (subtle) -->
  <circle cx="1080" cy="60" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.1"/>
  <circle cx="1086" cy="56" r="22" fill="#000"/>

  <!-- Floor line -->
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="0" y="180" width="1200" height="40" fill="url(#floorY)"/>

  <!-- Speed lines from left -->
  <g stroke="#ffffff" stroke-width="0.9" opacity="0.5">
    <line x1="0" y1="40" x2="180" y2="80"/>
    <line x1="0" y1="70" x2="200" y2="100"/>
    <line x1="0" y1="100" x2="180" y2="120"/>
    <line x1="0" y1="130" x2="160" y2="140"/>
    <line x1="0" y1="160" x2="120" y2="160"/>
  </g>

  <!-- Figure — center-left, calm stance, sword drawn diagonally -->
  <g transform="translate(360,90)">
    <!-- Katana blade across the panel (from upper-right of figure to lower-right of panel) -->
    <line x1="20" y1="-10" x2="500" y2="120" stroke="#ffffff" stroke-width="2.2"/>
    <line x1="20" y1="-6" x2="500" y2="124" stroke="#ffffff" stroke-width="0.9" opacity="0.5"/>
    <!-- Tsuba (guard) -->
    <rect x="14" y="-14" width="14" height="8" fill="#000" stroke="#ffffff" stroke-width="1.2"/>
    <!-- Hilt -->
    <rect x="-2" y="-12" width="18" height="6" fill="#000" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Body silhouette: long coat / uniform -->
    <path d="M -70,30
             L -55,-20
             L -30,-38
             L 30,-38
             L 55,-20
             L 70,30
             L 60,130
             L -60,130 Z"
          fill="#000" stroke="#ffffff" stroke-width="1.4"/>
    <!-- Center seam -->
    <line x1="0" y1="-20" x2="0" y2="128" stroke="#ffffff" stroke-width="1"/>

    <!-- Sword arm extended right, holding hilt -->
    <path d="M 55,-12 L 8,-14 L 2,-2 L 50,4 Z" fill="#000" stroke="#ffffff" stroke-width="1.3"/>

    <!-- Other arm tucked down -->
    <path d="M -55,-12 L -68,80 L -55,90 L -42,0 Z" fill="#000" stroke="#ffffff" stroke-width="1.3"/>

    <!-- Neck -->
    <rect x="-10" y="-50" width="20" height="14" fill="#000" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Head -->
    <path d="M -30,-58
             C -34,-90 -22,-114 0,-118
             C 24,-114 36,-90 32,-58
             C 28,-40 14,-32 0,-32
             C -14,-32 -28,-40 -30,-58 Z"
          fill="#000" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Hair: messy bangs covering eyes -->
    <path d="M -30,-58
             C -36,-100 -20,-122 0,-124
             C 24,-122 38,-100 32,-58
             L 30,-58
             C 26,-78 16,-90 0,-90
             C -10,-90 -18,-86 -22,-78
             L -8,-58
             L -16,-50
             L -28,-58 Z"
          fill="#ffffff"/>
    <!-- More strands -->
    <path d="M 4,-94 L 0,-58 L 8,-50 L 14,-86 Z" fill="#ffffff"/>
    <path d="M 18,-90 L 14,-56 L 24,-50 L 30,-80 Z" fill="#ffffff"/>

    <!-- Mouth — neutral -->
    <line x1="-4" y1="-44" x2="6" y2="-44" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Spectral cursed-spirit wisp behind figure (subtle) -->
  <g opacity="0.35" fill="none" stroke="#ffffff" stroke-width="1.1">
    <path d="M 270,30 C 240,50 260,90 230,110 C 250,140 220,170 250,190"/>
    <path d="M 300,20 C 280,60 310,80 290,120"/>
  </g>

  <!-- SFX text (vertical, manga-style) -->
  <g transform="translate(60,40)" font-family="Georgia, serif" fill="#ffffff" opacity="0.85">
    <text x="0" y="0" font-size="28" font-style="italic">silence —</text>
    <text x="0" y="28" font-size="13" font-family="Courier New, Menlo, monospace" fill="#888" letter-spacing="4">SFX  ·  shhk</text>
  </g>

  <!-- Caption box bottom-right -->
  <g transform="translate(820,32)">
    <rect x="0" y="0" width="340" height="58" fill="#000" stroke="#ffffff" stroke-width="1.2"/>
    <text x="16" y="24" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#fff">
      The blade is patient.
    </text>
    <text x="16" y="44" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#aaa">
      It does not need to be drawn often.
    </text>
  </g>

  <!-- Page label -->
  <text x="20" y="212" font-family="Courier New, Menlo, monospace" font-size="10" fill="#666" letter-spacing="4">
    INTERLUDE  ·  THE SWORDBEARER
  </text>
</svg>
